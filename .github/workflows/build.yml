name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK para descargar desde el movil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RachaDetox.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima RachaDetox.apk --title "Racha Detox (última versión)" --notes "Descarga RachaDetox.apk desde el móvil e instálalo."
